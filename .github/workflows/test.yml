name: Tests

# Opt into Node 24 for JS actions; official actions below are updated accordingly.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Maintenance LTS + Active LTS. Node 18/20 are EOL (no security patches).
        # Keep in sync with .nvmrc (24) and package.json engines (>=22).
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate schema
        run: npm run validate:schema

      - name: Run linter
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm run test:run

      - name: Build core production profile
        run: VITE_MVP_MODE=1 npm run build

      - name: Build production profile (M1–9)
        run: VITE_MAX_BUILD_MODULE=9 npm run build

      - name: Build corporate12 profile (M1–12)
        run: VITE_MAX_BUILD_MODULE=12 npm run build

      - name: Build corporate15 profile (M1–15)
        run: VITE_MAX_BUILD_MODULE=15 npm run build

      # Guard must name a version present in the matrix above, otherwise coverage
      # upload silently stops running while CI stays green.
      - name: Upload coverage reports
        if: matrix.node-version == '24.x'
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/coverage-final.json
          fail_ci_if_error: false

  # Teaching-element / tools governance. Data-only checks, so one Node version is
  # enough; runs in parallel with `test` instead of blocking it.
  governance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Diagram/lab overlay coverage, registry number drift, tools parity and
      # generated build-profile drift. Local equivalent: npm run audit:governance
      - name: Audit schemes, labs and tools
        run: npm run audit:governance
